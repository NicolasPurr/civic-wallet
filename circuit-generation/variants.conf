# Circuit variants: the single source of truth for build.sh, run.sh and
# tools/generate_fixtures.mjs. Depths come from the deployment scenarios in
# DEPTHS.md. Rows are ordered by increasing cost; run.sh benchmarks them in
# this order, so the heaviest circuit (the ablation control) runs last.
#
# name                  template  state_depth  bl_depth
standard_metro          standard  41           0
standard_nation         standard  44           0
standard_union          standard  47           0
standard_global         standard  51           0
advanced_metro          advanced  41           23
advanced_nation         advanced  44           23
advanced_union          advanced  47           26
advanced_global         advanced  51           29
# Ablation control, not a deployment variant: a blacklist depth of 160
# reproduces the cost of the v1 circuit.
advanced_union_bl160    advanced  47           160
